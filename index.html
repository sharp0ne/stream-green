<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stream.green — Ultra-light binary transaction data</title>
<style>
  body {
    background: #0d1217;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* GPU-versnelde animaties via transform en opacity */
  @keyframes tapPulse {
    0%, 100% { transform: translateY(0); }
    15% { transform: translateY(12px) rotate(-4deg); }
    25% { transform: translateY(0); }
  }

  @keyframes streamFlow {
    0% { stroke-dashoffset: 280; opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0.2; }
  }

  @keyframes packetHop {
    0% { transform: translateX(0); opacity: 0; }
    25% { opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translateX(190px); opacity: 0; }
  }

  @keyframes receiptReveal {
    0%, 40% { transform: translateY(15px); opacity: 0; }
    60%, 90% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }

  .card { animation: tapPulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 75px 85px; will-change: transform; }
  .pulse-line { stroke-dasharray: 280; stroke-dashoffset: 280; animation: streamFlow 4s linear infinite; }
  .bit-packet { animation: packetHop 4s ease-in-out infinite; will-change: transform; }
  .phone-receipt { animation: receiptReveal 4s ease-out infinite; transform-origin: center; will-change: transform, opacity; }

  /* Opvallende contactknop */
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background-color: #00E676;
    color: #051b11;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 9999px;
    box-shadow: 0 0 25px rgba(0, 230, 118, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    letter-spacing: 0.3px;
  }

  .contact-btn:hover {
    background-color: #1ef38a;
    transform: translateY(-2px);
    box-shadow: 0 0 35px rgba(0, 230, 118, 0.6);
  }

  .contact-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
</style>
</head>
<body>

<div class="container">
  <!-- INTERACTIEVE VISUALISATIE -->
  <svg viewBox="0 0 540 220" width="540" height="220" xmlns="http://www.w3.org/2000/svg" style="font-family: monospace, sans-serif; max-width: 100%; height: auto;">
    <defs>
      <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00E676" stop-opacity="0.1" />
        <stop offset="50%" stop-color="#00E676" stop-opacity="1" />
        <stop offset="100%" stop-color="#00B0FF" stop-opacity="0.8" />
      </linearGradient>
    </defs>

    <!-- STAP 1: PINPAS & TERMINAL -->
    <g id="pos-terminal">
      <rect x="40" y="110" width="70" height="85" rx="10" fill="#161f28" stroke="#263545" stroke-width="2"/>
      <rect x="48" y="118" width="54" height="30" rx="4" fill="#0b1015"/>
      <path d="M71 133 a8 8 0 0 1 8 -8 M71 137 a4 4 0 0 1 4 -4" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>
      <circle cx="56" cy="162" r="2.5" fill="#3a4d61"/><circle cx="75" cy="162" r="2.5" fill="#3a4d61"/><circle cx="94" cy="162" r="2.5" fill="#3a4d61"/>
      <circle cx="56" cy="174" r="2.5" fill="#3a4d61"/><circle cx="75" cy="174" r="2.5" fill="#3a4d61"/><circle cx="94" cy="174" r="2.5" fill="#3a4d61"/>
      
      <!-- Geanimeerde Kaart (Tap) -->
      <g class="card">
        <rect x="45" y="60" width="60" height="38" rx="5" fill="#1f2d3d" stroke="#00E676" stroke-width="1.5"/>
        <rect x="52" y="70" width="12" height="9" rx="2" fill="#ffd54f"/>
      </g>
    </g>

    <!-- STAP 2: DE COMPACTE GROENE DATASTROOM -->
    <g id="stream-layer">
      <path d="M 115 130 C 190 130, 230 110, 310 110 C 360 110, 390 130, 430 130" fill="none" stroke="#16222f" stroke-width="4" stroke-linecap="round"/>
      <path class="pulse-line" d="M 115 130 C 190 130, 230 110, 310 110 C 360 110, 390 130, 430 130" fill="none" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Byte Payload -->
      <g class="bit-packet">
        <circle cx="160" cy="126" r="4" fill="#00E676"/>
        <text x="170" y="122" fill="#00E676" font-size="9" letter-spacing="1">01100111</text>
        <text x="170" y="132" fill="#81c784" font-size="7">72 B</text>
      </g>
    </g>

    <!-- STAP 3: MOBIELE BANK-APP MET DIGITALE BON -->
    <g id="bank-app">
      <rect x="420" y="45" width="80" height="150" rx="14" fill="#161f28" stroke="#263545" stroke-width="2"/>
      <rect x="425" y="55" width="70" height="130" rx="8" fill="#0b1015"/>
      <line x1="450" y1="50" x2="470" y2="50" stroke="#263545" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Digitale bon die oplicht bij ontvangst -->
      <g class="phone-receipt">
        <rect x="430" y="70" width="60" height="85" rx="5" fill="#142321" stroke="#00E676" stroke-width="1"/>
        <text x="436" y="84" fill="#00E676" font-size="7" font-weight="bold">TRANSACTIE</text>
        <line x1="436" y1="90" x2="484" y2="90" stroke="#214537" stroke-width="1"/>
        <text x="436" y="101" fill="#cfd8dc" font-size="6">Bio Haver</text><text x="472" y="101" fill="#cfd8dc" font-size="6">1.89</text>
        <text x="436" y="111" fill="#cfd8dc" font-size="6">Appels</text><text x="472" y="111" fill="#cfd8dc" font-size="6">2.40</text>
        
        <!-- Groenvoordeel label -->
        <rect x="434" y="122" width="52" height="15" rx="3" fill="#00E676"/>
        <text x="438" y="132" fill="#051b11" font-size="6" font-weight="bold">+ €0,50 GROEN</text>
      </g>
    </g>
  </svg>

  <!-- OPVALLENDE CONTACTKNOP -->
  <a class="contact-btn" href="mailto:koen@stream.green?subject=Inquiry%20regarding%20stream.green%20protocol">
    <svg viewBox="0 0 24 24">
      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </svg>
    <span>Contact: koen@stream.green</span>
  </a>
</div>

</body>
</html>
